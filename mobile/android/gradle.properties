# -Xmx2048m was enough before the UI revamp; adding react-native-screens +
# react-native-svg multiplied the debug .so payload and ApkFlinger now runs out
# of heap while writing the APK ("java.lang.OutOfMemoryError: Java heap space").
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
reactNativeArchitectures=arm64-v8a,x86_64
hermesEnabled=true
edgeToEdgeEnabled=false
