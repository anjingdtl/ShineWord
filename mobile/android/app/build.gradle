apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath

react {
    debuggableVariants = ["debug"]
    autolinkLibrariesWithApp()
}

def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

def releaseSigningVariableNames = [
    "SHINE_WRITER_RELEASE_STORE_FILE",
    "SHINE_WRITER_RELEASE_STORE_PASSWORD",
    "SHINE_WRITER_RELEASE_KEY_ALIAS",
    "SHINE_WRITER_RELEASE_KEY_PASSWORD",
]
def releaseSigningValues = releaseSigningVariableNames.collectEntries { name ->
    [name, System.getenv(name)]
}

if (releaseBuildRequested) {
    def missingReleaseSigningValues = releaseSigningValues.findAll { name, value ->
        value == null || value.trim().isEmpty()
    }.keySet()
    if (!missingReleaseSigningValues.isEmpty()) {
        throw new GradleException(
            "Release signing requires environment variable(s): ${missingReleaseSigningValues.join(', ')}. " +
            "Debug builds do not require release signing secrets."
        )
    }
    def releaseStoreFile = file(releaseSigningValues["SHINE_WRITER_RELEASE_STORE_FILE"])
    if (!releaseStoreFile.exists()) {
        throw new GradleException("Release signing keystore not found: ${releaseStoreFile.absolutePath}")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shineword.app"

    defaultConfig {
        applicationId "com.shineword.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.2.0-p2.8"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (releaseBuildRequested) {
                storeFile file(releaseSigningValues["SHINE_WRITER_RELEASE_STORE_FILE"])
                storePassword releaseSigningValues["SHINE_WRITER_RELEASE_STORE_PASSWORD"]
                keyAlias releaseSigningValues["SHINE_WRITER_RELEASE_KEY_ALIAS"]
                keyPassword releaseSigningValues["SHINE_WRITER_RELEASE_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.7.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
