apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath

react {
    debuggableVariants = ["debug"]
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shineword.app"

    defaultConfig {
        applicationId "com.shineword.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.2.0-p2.8"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Independent ShineWord signing; credentials arrive via
            // SHINEWORD_RELEASE_* env vars (never committed).
            def ksFile = file("../keystores/shineword-release.keystore")
            if (ksFile.exists() && System.getenv("SHINEWORD_RELEASE_STORE_PASS") != null) {
                signingConfigs {
                    release {
                        storeFile ksFile
                        storePassword System.getenv("SHINEWORD_RELEASE_STORE_PASS")
                        keyAlias "shineword"
                        keyPassword System.getenv("SHINEWORD_RELEASE_KEY_PASS")
                    }
                }
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.7.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
